<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og-image source</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2)}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2)}
@font-face{font-family:"Barlow";font-weight:500;src:url(/node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2)}
@font-face{font-family:"Barlow";font-weight:600;src:url(/node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2)}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#eceff1;color:#14181c;font-family:"Barlow",sans-serif;overflow:hidden}
.plate{height:112px;background:#1f5f8b;color:#fff;display:flex;align-items:center;padding:0 72px;font:700 64px "Barlow Condensed";letter-spacing:.14em;text-transform:uppercase}
.card{position:absolute;left:72px;top:150px;width:1056px;height:382px;background:#f8fafb;border:2px solid #b9c3ca;border-radius:4px;padding:40px 56px}
.label{font:600 40px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:#1f5f8b}
.row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:20px}
.tiles{display:flex;gap:8px;font:600 190px/1 "Barlow";font-variant-numeric:tabular-nums}
.tile{position:relative;width:.7em;height:1.3em;background:#0d1114;color:#eceff1;display:flex;align-items:center;justify-content:center;border-radius:.06em;overflow:hidden}
.tile:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(236,239,241,.15)}
.side{text-align:right;color:#46515a}
.side .of{font:600 44px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase}
.tag{position:absolute;left:72px;bottom:32px;font:500 30px "Barlow";color:#46515a}
</style></head><body>
<div class="plate">Countsy</div>
<div class="card">
  <div class="label">Glasses of water</div>
  <div class="row">
    <div class="tiles"><span class="tile">0</span><span class="tile">0</span><span class="tile">0</span><span class="tile">7</span></div>
    <div class="side">
      <svg width="96" height="96" viewBox="0 0 40 40" style="color:#46515a"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="20" y1="6" x2="20" y2="34"/><line x1="20" y1="6" x2="20" y2="34" transform="rotate(60 20 20)"/><line x1="20" y1="6" x2="20" y2="34" transform="rotate(120 20 20)"/></g><circle cx="20" cy="20" r="3" fill="currentColor"/></svg>
      <div class="of">of 8</div>
    </div>
  </div>
</div>
<div class="tag">Simple counters.</div>
</body></html>
